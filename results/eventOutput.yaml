---
document:
  dsl: 1.0.0
  namespace: default
  name: monitorvitals
  version: 1.0
do:
- MonitorVitals:
    listen:
      to:
        any:
        - with:
            type: com.hospital.vitals.temperature.high
        - with:
            type: com.hospital.vitals.bloodpressure.high
        - with:
            type: com.hospital.vitals.respiration.high
      read: data
    foreach:
      item: item
      at: index
      do:
      - sendTylenolOrder:
          call: sendTylenolOrder
          with:
            patientid: "${ .patientId }"
      - callNurse:
          call: callNurse
          with:
            patientid: "${ .patientId }"
      - callPulmonologist:
          call: callPulmonologist
          with:
            patientid: "${ .patientId }"
